<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MineKart | Shop Everything You Love</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/jpeg"
      href="https://minekart.vercel.app/cart_image.jpg"
    />

    <!-- Basic SEO -->
    <meta
      name="description"
      content="Discover products, great deals and easy shopping with MineKart."
    />

    <meta
      name="keywords"
      content="MineKart, online shopping, ecommerce, products, shopping India"
    />

    <meta name="author" content="MineKart" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta
      property="og:title"
      content="MineKart | Shop Everything You Love"
    />

    <meta
      property="og:description"
      content="Discover products, great deals and easy shopping with MineKart."
    />

    <meta
      property="og:image"
      content="https://minekart.vercel.app/brand.png"
    />

    <meta
      property="og:url"
      content="https://minekart.vercel.app/"
    />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="MineKart" />

    <meta property="og:locale" content="en_IN" />

    <!-- Recommended image metadata -->
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="MineKart | Shop Everything You Love"
    />

    <meta
      name="twitter:description"
      content="Discover products, great deals and easy shopping with MineKart."
    />

    <meta
      name="twitter:image"
      content="https://minekart.vercel.app/brand.png"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://minekart.vercel.app/"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
